name: BingX Market Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      ENABLE_AUTO_TRADE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run market scanner
        run: python scanner.py

      - name: Save market snapshot
        if: always()
        shell: bash
        run: |
          if [ ! -f market_snapshot.json ]; then
            echo "No snapshot file to save."
            exit 0
          fi

          if git diff --quiet -- market_snapshot.json; then
            echo "No tracked snapshot changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- market_snapshot.json
          git commit -m "Update market snapshot"
          git push

      - name: Upload scanner state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-market-monitor-state
          path: |
            market_snapshot.json
            trades_history.json
          if-no-files-found: ignore
          retention-days: 14
